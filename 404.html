<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JSON response</title>
</head>
<body>
<script>
  (async () => {
    try {
      const res = await fetch('https://borko-jovanovic.github.io/stremio-test-addon/manifest.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('manifest fetch failed: ' + res.status);
      const manifest = await res.json();
      document.open('application/json', 'replace');
      document.write(JSON.stringify(manifest));
      document.close();
    } catch (err) {
      document.open('application/json', 'replace');
      document.write(JSON.stringify({ error: 'manifest_not_found', message: err.message }));
      document.close();
    }
  })();
</script>
</body>
</html>
